<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Expense Tracker</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-button" title="Toggle theme" aria-label="Toggle theme">🌙</button>
        <button id="add-expense" class="primary-button"><span>+</span> Add Expense</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="period-row">
      <div class="mode-switch">
        <button id="month-mode" class="mode-button active">Month</button>
        <button id="custom-mode" class="mode-button">Custom</button>
      </div>
      <div id="month-controls" class="month-controls">
        <button id="previous-month" class="small-button" aria-label="Previous month">‹</button>
        <strong id="month-label" class="month-label"></strong>
        <button id="next-month" class="small-button" aria-label="Next month">›</button>
      </div>
      <div id="custom-controls" class="custom-controls" hidden>
        <label>From <input id="date-from" type="date"></label>
        <span>→</span>
        <label>To <input id="date-to" type="date"></label>
      </div>
    </section>

    <section class="summary-grid">
      <article class="summary-card">
        <p class="eyebrow">Period Total</p>
        <p id="period-total" class="summary-value">$0.00</p>
        <p id="expense-count" class="summary-subtitle">0 expenses</p>
      </article>
      <article class="summary-card">
        <p class="eyebrow">Daily Average</p>
        <p id="daily-average" class="summary-value">$0.00</p>
        <p id="period-description" class="summary-subtitle"></p>
      </article>
      <article class="summary-card">
        <p class="eyebrow">Top Category</p>
        <p id="top-category" class="summary-value serif-value">—</p>
        <p class="summary-subtitle">by amount</p>
      </article>
    </section>

    <section id="category-filters" class="category-filters"></section>
    <section id="expense-list" class="expense-list" aria-live="polite"></section>
    <p id="status-message" class="status-message" role="status"></p>
  </main>

  <div id="expense-modal" class="modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-heading">
        <h2 id="modal-title">New Expense</h2>
        <button id="close-modal" class="close-button" aria-label="Close">✕</button>
      </div>
      <form id="expense-form">
        <label class="form-label">Expense Name
          <input id="expense-name" type="text" placeholder="e.g. Grocery run" required>
        </label>
        <div class="form-grid">
          <label class="form-label">Amount (USD)
            <input id="expense-price" type="number" step="0.01" min="0.01" placeholder="0.00" required>
          </label>
          <label class="form-label">Date
            <input id="expense-date" type="date" required>
          </label>
        </div>
        <div class="form-label">
          <span>Category</span>
          <div id="modal-categories" class="modal-categories"></div>
          <div class="category-create">
            <input id="new-category-name" type="text" placeholder="New category name" aria-label="New category name">
            <button id="create-category" type="button" class="secondary-button">+ Add category</button>
          </div>
        </div>
        <label class="form-label">Comment (Optional)
          <textarea id="expense-comment" rows="2" placeholder="e.g. Bought at a discount sale"></textarea>
        </label>
        <p id="form-error" class="form-error" role="alert"></p>
        <button id="save-expense" type="submit" class="primary-button submit-button">Add Expense</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
